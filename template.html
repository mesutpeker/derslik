<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Karaman MTAL — Ders ve Öğretmen Takip Sistemi</title>
  <style>/* STYLES */</style>
</head>
<body>
  <header class="app-header"><div class="header-inner">
    <div class="brand"><div class="brand-mark" aria-hidden="true">KM</div><div><h1>Karaman MTAL</h1><p>Ders Takip</p></div></div>
    <button id="now-button" class="primary-button" type="button" aria-label="Şu anki dersi seç">Şu An</button>
  </div></header>
  <main>
    <section class="filter-panel" aria-labelledby="filter-heading">
      <div class="filter-heading"><h2 id="filter-heading">Dersler</h2><button id="reset-button" type="button" class="text-button">Temizle</button></div>
      <div class="filters">
        <div class="filter-field"><label for="filter-day">Gün</label><select id="filter-day"></select></div>
        <div class="filter-field"><label for="filter-class">Sınıf düzeyi</label><select id="filter-class"></select></div>
        <div class="filter-field"><label for="filter-period">Ders saati</label><select id="filter-period"></select></div>
        <div class="filter-field"><label for="filter-teacher">Öğretmen</label><select id="filter-teacher"></select></div>
      </div>
    </section>
    <p id="current-status" class="current-status" role="status" aria-live="polite" hidden></p>
    <div class="results-bar" role="status" aria-live="polite"><p id="filter-summary" class="filter-summary"></p><span id="result-count" class="result-count"></span></div>
    <div id="results-container" class="results"></div>
    <div id="empty-state" class="empty-state" hidden><h2>Ders bulunamadı</h2><p id="empty-description"></p></div>
    <noscript><p class="noscript">Programı filtrelemek için tarayıcınızda JavaScript’i etkinleştirin.</p></noscript>
  </main>
  <script id="school-data" type="application/json">/* DATA */</script>
  <script>/* CORE */</script>
  <script>/* UI */</script>
</body>
</html>
